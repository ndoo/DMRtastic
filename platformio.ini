[env:mduv390plus]
platform = ststm32@19.6.0  ; Zephyr 4.4.0 — pin to prevent silent Zephyr version drift
framework = zephyr
board = mduv390plus

; Custom upload: TYT DFU bootloader (west flash is not supported)
extra_scripts =
    pre:tools/apply_patches.py
    pre:tools/install_upload_deps.py
upload_protocol = custom
upload_command = ${PYTHONEXE} -u ${PROJECT_DIR}/tools/flash_tyt_dfu.py $SOURCE
