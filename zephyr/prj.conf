# DMRtastic project configuration
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_HWINFO=y

# JEDEC ID readback for the codeplug flash's identity sanity check (cp info)
CONFIG_FLASH_JESD216_API=y

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# USART1 GPS RX (model/gps.c) needs interrupt-driven UART; already pulled in
# transitively by CONFIG_USBD_CDC_ACM_CLASS above but declared explicitly since
# GPS now depends on it directly too.
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_DISPLAY_LOG_LEVEL_WRN=y
CONFIG_MIPI_DBI_LOG_LEVEL_WRN=y


CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_DRAW_VG_LITE=n
CONFIG_LV_USE_VG_LITE_THORVG=n
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LOG_OUTPUT=y
CONFIG_RING_BUFFER=y
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_WATCHDOG=y
CONFIG_IWDG_STM32_INITIAL_TIMEOUT=100

# sys_reboot() — used by shell_radio.c's "reboot" command to capture a
# fresh boot log on demand during troubleshooting.
CONFIG_REBOOT=y

# SPI / I2C / GPIO for the radio stack
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SPI=y
CONFIG_SPI_BITBANG_IRQ=y
CONFIG_I2C=y
CONFIG_I2C_STM32_BUS_RECOVERY=y
CONFIG_RADIO_AT1846S=y
CONFIG_RADIO_HR_C6000=y

# UI fonts (only what's used — saves flash)
# Montserrat 10 stays compiled in as the pre-theme LV_FONT_DEFAULT fallback
# (used before lv_theme_default_init() runs at boot); the actual UI theme font
# is a custom font from src/view/fonts/, wired up in display.c.
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_10=y

# LVGL rejects uncompressed 3bpp glyph bitmaps (only 1/2/4/8bpp support that
# path); the custom fonts use 3bpp RLE-compressed, so decoding them needs
# this enabled or lv_font_get_bitmap_fmt_txt() silently returns NULL.
CONFIG_LV_USE_FONT_COMPRESSED=y

# Flex layout for menu list and status bar
CONFIG_LV_USE_FLEX=y

# Input subsystem: keypad matrix (kbd_matrix_shared_bus), PTT (gpio-keys), rotary encoder
# (gpio-qdec, auto-selected from DT), volume pot (analog-axis).
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_INPUT_ANALOG_AXIS=y
CONFIG_ADC=y

# RTC (LSE-clocked, backed by &rtc in the board DTS); RTC_STM32 auto-selects from DT.
CONFIG_RTC=y
