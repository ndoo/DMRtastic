# Overrides applied on top of zephyr/prj.conf for the native_sim build.
CONFIG_LOG_BACKEND_UART=n
CONFIG_ADC_EMUL=y
CONFIG_FLASH=y

# 64-bit pointers inflate LVGL object sizes; the ARM pool size is too small here.
CONFIG_LV_Z_MEM_POOL_SIZE=262144
