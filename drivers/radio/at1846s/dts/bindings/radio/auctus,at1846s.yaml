description: |
  Auctus AT1846S single-chip RF transceiver (I2C).

compatible: "auctus,at1846s"

include: [i2c-device.yaml]

properties:
  reg:
    required: true

  freq-ranges:
    type: array
    description: |
      Pairs of (low, high) frequencies in Hz that this transceiver supports.
      Each pair defines one band. Used by the driver to validate
      set_frequency() calls and by the radio manager to derive band
      switching. A typical dual-band MD-UV390 PLUS configuration is:
      <134000000 174000000  400000000 520000000>.

  band-select-gpios:
    type: phandle-array
    description: |
      Optional GPIOs driven HIGH for one band, LOW for the other (and vice
      versa for the second pin) to switch the external front-end band path.
      The driver activates the appropriate pattern at set_frequency() time.

  rx-audio-mux-gpios:
    type: phandle-array
    description: |
      Optional GPIO controlling the FM/digital audio mux. HIGH = AT1846S
      analog FM demodulator output routed to the speaker amp; LOW = digital
      baseband audio path. Asserted by the driver on entry to FM RX mode.

  amp-en-gpios:
    type: phandle-array
    description: Optional speaker amplifier enable. Asserted on FM RX entry.

  spk-mute-gpios:
    type: phandle-array
    description: |
      Optional speaker mute. Polarity is captured via GPIO_ACTIVE_HIGH /
      GPIO_ACTIVE_LOW on the cell; gpio_pin_set_dt(spec, 0) always means
      "unmuted" and gpio_pin_set_dt(spec, 1) means "muted".

  squelch-gpios:
    type: phandle-array
    description: |
      Optional AT1846S GPIO6 output. Goes high when the chip's squelch
      opens (signal above threshold). Wire to an interrupt-capable MCU pin
      for low-latency squelch notification; otherwise the radio manager
      polls RSSI on a timer.

  css-detect-gpios:
    type: phandle-array
    description: |
      Optional AT1846S GPIO1 output. Goes high when CTCSS/DCS conditions
      are met. Wire to an interrupt-capable MCU pin for low-latency CSS
      notification; otherwise the driver polls register 0x1C.

  baseband-handles-deemphasis:
    type: boolean
    description: |
      Set when a companion baseband IC performs FM de-emphasis. Causes the
      driver to disable the AT1846S internal de-emphasis filter.

  baseband-handles-ctcss-dcs:
    type: boolean
    description: |
      Set when a companion baseband IC handles CTCSS/DCS encode/decode.
      Causes the driver's CTCSS/DCS API to become no-ops.

  squelch-mode:
    type: string
    enum: ["hardware", "software"]
    default: "software"
    description: |
      hardware: chip register SQ_THRESH gates audio internally; GPIO6
      mirrors squelch state. Lower MCU overhead but no speaker-mute
      synchronisation unless squelch-gpios is also wired.
      software: SQ_THRESH=0 (chip in monitor mode); the driver spawns a
      squelch thread that polls AT1846S RSSI register 0x1B every
      RADIO_AT1846S_SQUELCH_POLL_MS ms and controls spk-mute-gpios /
      amp-en-gpios directly. Hysteresis of 3 noise units prevents
      squelch chatter.

  tx-freq-offset-hz:
    type: int
    default: 0
    description: |
      Fixed TX frequency offset applied by the driver to compensate
      systematic VCO pull. Default 0; some boards need a few kHz.

  volume-taper:
    type: string
    enum: ["linear", "audio-a"]
    default: "linear"
    description: |
      Which standard taper curve the volume pot follows. Selects one of a
      small set of built-in reverse-mapping lookup tables in the UI layer
      (src/ui/ui.c, see taper_lut_*) that convert the pot's raw 0-100%
      reading back to a perceptually-linear percentage for display only --
      set_volume() always receives the raw value unchanged, since the
      pot's own taper is what gives volume control its natural feel; only
      the overlay/status display is reverse-mapped.

        linear:  identity mapping (no correction); for a linear-taper (B)
                 pot.
        audio-a: standard "A"/audio-log taper, approximated as the common
                 industry two-linear-segment curve ("50% rotation ~= 10-15%
                 of range") rather than a smooth analytic formula -- a
                 pot's real response rarely matches one.

      For a pot that doesn't fit either preset, add a new enum value here
      plus a matching taper_lut_* table in ui.c rather than hand-deriving
      numbers in DTS.
