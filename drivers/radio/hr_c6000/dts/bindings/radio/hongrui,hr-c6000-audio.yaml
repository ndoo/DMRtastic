description: |
  HR-C6000 audio SPI passthrough. Represents the HR-C6000 chip select on
  a separate hardware SPI audio bus dedicated to AMBE vocoder frame
  transfers (chip page 0x03). Carries no custom properties; the node
  exists to satisfy the audio-spi-dev phandle reference on the main
  hr-c6000 node and to provide a spi_dt_spec the HR-C6000 driver can use
  for AMBE reads and writes.

compatible: "hongrui,hr-c6000-audio"

include: [spi-device.yaml]
